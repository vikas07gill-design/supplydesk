<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Search | SupplyDesk</title><meta name="description" content="Search products, suppliers and supply services on SupplyDesk.">
<style>
:root{--ink:#0d2430;--muted:#647780;--line:#dbe7eb;--bg:#f5fafb;--card:#fff;--brand:#087f8c;--dark:#092a38}.wrap{max-width:1120px;margin:auto;padding:0 20px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}a{text-decoration:none;color:inherit}nav{height:70px;background:rgba(255,255,255,.94);border-bottom:1px solid var(--line);display:flex;align-items:center;position:sticky;top:0;z-index:20;backdrop-filter:blur(12px)}.nav{width:100%;display:flex;justify-content:space-between;align-items:center}.logo{font-size:21px;font-weight:900;letter-spacing:-.04em}.logo span{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#2fd0bd,#2377b7);color:#fff;margin-right:8px}.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 15px;font-weight:800;cursor:pointer;color:var(--ink)}.primary{background:var(--brand);border-color:var(--brand);color:#fff}.top{padding:43px 0 18px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--brand);font-weight:900}.top h1{font-size:clamp(32px,4vw,46px);letter-spacing:-.05em;margin:10px 0 7px}.top p{margin:0;color:var(--muted)}.search{display:flex;gap:9px;margin-top:22px}.search input{flex:1;height:52px;border:1px solid var(--line);border-radius:12px;padding:0 15px;font:inherit;background:#fff;outline:none}.search input:focus{border-color:#83cfc6;box-shadow:0 0 0 4px rgba(8,127,140,.08)}.tabs{display:flex;gap:8px;margin:20px 0 14px}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 15px;color:var(--muted);font-size:13px;cursor:pointer}.tab.active{background:#e8f7f5;color:var(--brand);border-color:#bfe4df;font-weight:800}.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:19px}.filters select{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px;color:var(--muted)}.summary{font-size:13px;color:var(--muted);margin:12px 0}.result{background:#fff;border:1px solid var(--line);border-radius:17px;padding:19px;margin-bottom:12px;display:flex;justify-content:space-between;gap:22px;transition:.18s}.result:hover{border-color:#9fd3cc;box-shadow:0 13px 32px rgba(13,36,48,.07);transform:translateY(-1px)}.result-main{min-width:0}.type{display:inline-flex;align-items:center;gap:6px;font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--brand);font-weight:900;margin-bottom:8px}.type:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}.result h3{margin:0 0 5px;font-size:19px;letter-spacing:-.02em}.meta{color:var(--muted);font-size:13px}.desc{color:#71828a;font-size:13px;line-height:1.55;margin:9px 0 0;max-width:700px}.tags{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}.tag{font-size:11px;background:#f1f6f7;border-radius:999px;padding:6px 8px;color:#526770}.result-actions{display:flex;align-items:center}.view{white-space:nowrap}.empty{padding:55px;text-align:center;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:17px}.empty h3{color:var(--ink);margin-top:0}.footer{padding:35px 0;color:#7b8c94;font-size:12px}@media(max-width:650px){.result{display:block}.result-actions{margin-top:15px}.search{flex-direction:column}.tabs{overflow:auto}.view{width:100%}}
</style></head>
<body><nav><div class="wrap nav"><a class="logo" href="index.html"><span>S</span>SupplyDesk</a><a class="btn" href="services.html">Services</a></div></nav>
<main class="wrap"><section class="top"><div class="eyebrow">Supply discovery</div><h1 id="title">Explore SupplyDesk</h1><p>Find products, suppliers and supply services.</p><div class="search"><input id="q" placeholder="Product, material, supplier or service"><button class="btn primary" onclick="run()">Search</button></div></section>
<div class="tabs"><button class="tab active" data-type="all">All</button><button class="tab" data-type="product">Products</button><button class="tab" data-type="supplier">Suppliers</button><button class="tab" data-type="service">Services</button></div>
<div class="filters"><select id="country" onchange="render()"><option value="">Any country</option><option>India</option><option>China</option><option>UAE</option><option>USA</option></select><select id="city" onchange="render()"><option value="">Any city</option><option>Delhi</option><option>Mumbai</option><option>Ahmedabad</option><option>Yiwu</option><option>Dubai</option><option>Shenzhen</option></select><select id="market" onchange="render()"><option value="">Any market</option><option>Domestic</option><option>International</option></select></div>
<div class="summary" id="summary"></div><section id="results"></section><div class="footer">SupplyDesk is an information and connection platform. Listings and business details are shown for discovery.</div></main>
<script>
const data=[
{id:'abc-plastics',name:'ABC Plastics Manufacturing',type:'supplier',city:'Yiwu',country:'China',market:'International',desc:'Manufacturer of household plastic products and kitchen storage items.',tags:['Plastic containers','Kitchenware','Manufacturer']},
{id:'india-growth',name:'India Growth Industries',type:'supplier',city:'Ahmedabad',country:'India',market:'Domestic',desc:'Indian manufacturer of plastic household and industrial articles.',tags:['Household','Plastics','Manufacturing']},
{id:'asia-components',name:'Asia Components',type:'supplier',city:'Shenzhen',country:'China',market:'International',desc:'Electronics components supplier serving domestic and export markets.',tags:['Electronics','Components','OEM']},
{id:'dubai-trading',name:'Dubai General Trading',type:'supplier',city:'Dubai',country:'UAE',market:'Domestic',desc:'General trading and distribution company serving the UAE market.',tags:['Trading','Distribution','Building materials']},
{id:'plastic-container',name:'Plastic Storage Container',type:'product',city:'Ahmedabad',country:'India',market:'Domestic',desc:'Example product listing with category, market and supplier connection.',tags:['Storage','Plastic','Household']},
{id:'freight-forwarding',name:'Freight Forwarding Provider',type:'service',city:'Dubai',country:'UAE',market:'International',desc:'Example logistics service provider for international cargo movements.',tags:['Freight','Logistics','International']}
];
const params=new URLSearchParams(location.search);document.getElementById('q').value=params.get('q')||'';let active=params.get('type')||'all';
document.querySelectorAll('.tab').forEach(b=>{b.classList.toggle('active',b.dataset.type===active);b.onclick=()=>{active=b.dataset.type;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.type===active));render()}})
function run(){const q=document.getElementById('q').value.trim();location.href=q?'search.html?q='+encodeURIComponent(q):'search.html'}
function match(x,q){return !q||(x.name+' '+x.desc+' '+x.tags.join(' ')).toLowerCase().includes(q.toLowerCase())}
function target(x){return x.type==='supplier'?'supplier.html?id='+encodeURIComponent(x.id):x.type==='product'?'product.html?id='+encodeURIComponent(x.id):'service.html?id='+encodeURIComponent(x.id)}
function render(){const q=document.getElementById('q').value.trim(),c=document.getElementById('country').value,city=document.getElementById('city').value,m=document.getElementById('market').value;const rows=data.filter(x=>(active==='all'||x.type===active)&&(!c||x.country===c)&&(!city||x.city===city)&&(!m||x.market===m)&&match(x,q));document.getElementById('title').textContent=q?'Results for “'+q+'”':'Explore SupplyDesk';document.getElementById('summary').textContent=rows.length+' result'+(rows.length===1?'':'s')+' · Products, suppliers and services';document.getElementById('results').innerHTML=rows.length?rows.map(x=>'<article class="result"><div class="result-main"><div class="type">'+x.type+'</div><h3>'+x.name+'</h3><div class="meta">📍 '+x.city+', '+x.country+' · '+x.market+'</div><div class="desc">'+x.desc+'</div><div class="tags">'+x.tags.map(t=>'<span class="tag">'+t+'</span>').join('')+'</div></div><div class="result-actions"><a class="btn primary view" href="'+target(x)+'">View '+(x.type==='product'?'Product':x.type==='service'?'Service':'Supplier')+' →</a></div></article>').join(''):'<div class="empty"><h3>No exact matches yet</h3><p>Try a broader term, another market, or clear the filters.</p><button class="btn" onclick="clearFilters()">Clear filters</button></div>'}
function clearFilters(){document.getElementById('country').value='';document.getElementById('city').value='';document.getElementById('market').value='';active='all';document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.type==='all'));render()}render();
</script></body></html>
