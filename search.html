<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Search | SupplyDesk</title>
<style>
:root{--ink:#10242d;--muted:#667780;--line:#dce6ea;--bg:#f6f9fb;--brand:#087f8c;--white:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1080px;margin:auto;padding:0 20px}
nav{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center}.nav{display:flex;justify-content:space-between;align-items:center;width:100%}.logo{font-size:21px;font-weight:850}.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 14px;font-weight:700;cursor:pointer;color:var(--ink)}.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.top{padding:34px 0 18px}.top h1{font-size:30px;margin:0 0 6px}.top p{margin:0;color:var(--muted)}.search{display:flex;gap:9px;margin-top:19px}.search input{flex:1;height:48px;border:1px solid var(--line);border-radius:10px;padding:0 14px;font:inherit;background:#fff}
.tabs{display:flex;gap:8px;margin:18px 0 14px}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;color:var(--muted);font-size:13px;cursor:pointer}.tab.active{background:#e9f7f5;color:var(--brand);border-color:#bfe4df;font-weight:700}
.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px}.filters select{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px;color:var(--muted)}
.summary{font-size:13px;color:var(--muted);margin:13px 0}.result{background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px;margin-bottom:11px;display:flex;justify-content:space-between;gap:20px}.result:hover{border-color:#abd9d4;box-shadow:0 8px 25px rgba(16,36,45,.05)}.result h3{margin:0 0 5px;font-size:17px}.meta{color:var(--muted);font-size:13px}.tags{display:flex;gap:6px;margin-top:11px;flex-wrap:wrap}.tag{font-size:11px;background:#f2f6f7;border-radius:7px;padding:5px 7px;color:#5b6e77}.type{display:inline-block;font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--brand);font-weight:800;margin-bottom:7px}.result-actions{display:flex;align-items:center;gap:8px}.empty{padding:45px;text-align:center;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:15px}.empty h3{color:var(--ink);margin-top:0}
@media(max-width:650px){.result{display:block}.result-actions{margin-top:14px}.search{flex-direction:column}.tabs{overflow:auto}}
</style></head>
<body>
<nav><div class="wrap nav"><a class="logo" href="index.html">SupplyDesk</a><a class="btn" href="services.html">Services</a></div></nav>
<main class="wrap">
<section class="top"><h1 id="title">Search SupplyDesk</h1><p>Find a product, supplier or supply service.</p><div class="search"><input id="q" placeholder="What are you looking for?"><button class="btn primary" onclick="run()">Search</button></div></section>
<div class="tabs" id="tabs"><button class="tab active" data-type="all">All</button><button class="tab" data-type="product">Products</button><button class="tab" data-type="supplier">Suppliers</button><button class="tab" data-type="service">Services</button></div>
<div class="filters"><select id="country" onchange="render()"><option value="">Any country</option><option>India</option><option>China</option><option>UAE</option><option>USA</option></select><select id="city" onchange="render()"><option value="">Any city</option><option>Delhi</option><option>Mumbai</option><option>Ahmedabad</option><option>Yiwu</option><option>Dubai</option><option>Shenzhen</option></select><select id="market" onchange="render()"><option value="">Domestic or international</option><option>Domestic</option><option>International</option></select></div>
<div class="summary" id="summary"></div><section id="results"></section>
</main>
<script>
const data=[
{name:'ABC Plastics Manufacturing',type:'supplier',city:'Yiwu',country:'China',market:'International',desc:'Manufacturer of household plastic products and kitchen storage items.',tags:['Plastic containers','Kitchenware','Manufacturer']},
{name:'India Growth Industries',type:'supplier',city:'Ahmedabad',country:'India',market:'Domestic',desc:'Indian manufacturer of plastic household and industrial articles.',tags:['Household','Plastics','Manufacturing']},
{name:'Asia Components',type:'supplier',city:'Shenzhen',country:'China',market:'International',desc:'Electronics components supplier serving domestic and export markets.',tags:['Electronics','Components','OEM']},
{name:'Dubai General Trading',type:'supplier',city:'Dubai',country:'UAE',market:'Domestic',desc:'General trading and distribution company serving the UAE market.',tags:['Trading','Distribution','Building materials']},
{name:'Plastic Storage Container',type:'product',city:'Ahmedabad',country:'India',market:'Domestic',desc:'Example product listing. Product details and supplier information will be connected to the database.',tags:['Storage','Plastic','Household']},
{name:'Freight Forwarding Provider',type:'service',city:'Dubai',country:'UAE',market:'International',desc:'Example logistics service provider for international cargo movements.',tags:['Freight','Logistics','International']}
];
const params=new URLSearchParams(location.search);const initial=params.get('q')||'';document.getElementById('q').value=initial;
let active='all';document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');active=b.dataset.type;render()});
function run(){const q=document.getElementById('q').value.trim();location.href=q?'search.html?q='+encodeURIComponent(q):'search.html'}
function match(item,q){if(!q)return true;return (item.name+' '+item.desc+' '+item.tags.join(' ')).toLowerCase().includes(q.toLowerCase())}
function render(){const q=document.getElementById('q').value.trim();const c=document.getElementById('country').value;const city=document.getElementById('city').value;const market=document.getElementById('market').value;
let rows=data.filter(x=>(active==='all'||x.type===active)&&(!c||x.country===c)&&(!city||x.city===city)&&(!market||x.market===market)&&match(x,q));
document.getElementById('title').textContent=q?'Results for “'+q+'”':'Explore SupplyDesk';document.getElementById('summary').textContent=rows.length+' results · Showing products, suppliers and services';
document.getElementById('results').innerHTML=rows.length?rows.map(x=>'<article class="result"><div><div class="type">'+x.type+'</div><h3>'+x.name+'</h3><div class="meta">'+x.city+', '+x.country+' · '+x.market+'</div><p class="meta" style="margin:8px 0 0;max-width:650px">'+x.desc+'</p><div class="tags">'+x.tags.map(t=>'<span class="tag">'+t+'</span>').join('')+'</div></div><div class="result-actions"><a class="btn primary" href="supplier.html?name='+encodeURIComponent(x.name)+'">View</a></div></article>').join(''):'<div class="empty"><h3>No exact matches yet</h3><p>Try a broader product name, another country, or browse all results.</p><button class="btn" onclick="clearFilters()">Clear filters</button></div>'}
function clearFilters(){document.getElementById('country').value='';document.getElementById('city').value='';document.getElementById('market').value='';active='all';document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.type==='all'));render()}render();
</script></body></html>
