<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"%3E%3Crect width="64" height="64" rx="18" fill="%23087f8c"/%3E%3Ccircle cx="32" cy="32" r="22" fill="none" stroke="white" stroke-width="3"/%3E%3Cpath d="M16 39c8-12 16-17 33-19M17 25c9 9 18 14 31 14" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity=".8"/%3E%3Ccircle cx="18" cy="39" r="3" fill="white"/%3E%3Ccircle cx="49" cy="20" r="3" fill="white"/%3E%3C/svg%3E"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Search | SupplyDesk</title><meta name="description" content="Search products, suppliers and supply services on SupplyDesk.">
<style>
:root{--ink:#0d2430;--muted:#647780;--line:#dbe7eb;--bg:#f5fafb;--card:#fff;--brand:#087f8c;--dark:#092a38}.wrap{max-width:1120px;margin:auto;padding:0 20px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}a{text-decoration:none;color:inherit}nav{height:70px;background:rgba(255,255,255,.94);border-bottom:1px solid var(--line);display:flex;align-items:center;position:sticky;top:0;z-index:20;backdrop-filter:blur(12px)}.nav{width:100%;display:flex;justify-content:space-between;align-items:center}.logo{font-size:21px;font-weight:900;letter-spacing:-.04em}.logo span{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#2fd0bd,#2377b7);color:#fff;margin-right:8px}.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 15px;font-weight:800;cursor:pointer;color:var(--ink)}.primary{background:var(--brand);border-color:var(--brand);color:#fff}.top{padding:43px 0 18px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--brand);font-weight:900}.top h1{font-size:clamp(32px,4vw,46px);letter-spacing:-.05em;margin:10px 0 7px}.top p{margin:0;color:var(--muted)}.search{display:flex;gap:9px;margin-top:22px}.search input{flex:1;height:52px;border:1px solid var(--line);border-radius:12px;padding:0 15px;font:inherit;background:#fff;outline:none}.search input:focus{border-color:#83cfc6;box-shadow:0 0 0 4px rgba(8,127,140,.08)}.tabs{display:flex;gap:8px;margin:20px 0 14px}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 15px;color:var(--muted);font-size:13px;cursor:pointer}.tab.active{background:#e8f7f5;color:var(--brand);border-color:#bfe4df;font-weight:800}.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:19px}.filters select{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px;color:var(--muted)}.summary{font-size:13px;color:var(--muted);margin:12px 0}.result{background:#fff;border:1px solid var(--line);border-radius:17px;padding:19px;margin-bottom:12px;display:flex;justify-content:space-between;gap:22px;transition:.18s}.result:hover{border-color:#9fd3cc;box-shadow:0 13px 32px rgba(13,36,48,.07);transform:translateY(-1px)}.result-main{min-width:0}.type{display:inline-flex;align-items:center;gap:6px;font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--brand);font-weight:900;margin-bottom:8px}.type:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}.result h3{margin:0 0 5px;font-size:19px;letter-spacing:-.02em}.meta{color:var(--muted);font-size:13px}.desc{color:#71828a;font-size:13px;line-height:1.55;margin:9px 0 0;max-width:700px}.tags{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}.tag{font-size:11px;background:#f1f6f7;border-radius:999px;padding:6px 8px;color:#526770}.result-actions{display:flex;align-items:center}.view{white-space:nowrap}.empty{padding:55px;text-align:center;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:17px}.empty h3{color:var(--ink);margin-top:0}.footer{padding:35px 0;color:#7b8c94;font-size:12px}@media(max-width:650px){.result{display:block}.result-actions{margin-top:15px}.search{flex-direction:column}.tabs{overflow:auto}.view{width:100%}}
.brand-logo{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0}.brand-mark{width:43px;height:43px;border-radius:14px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,#087f8c,#176aa5);box-shadow:0 9px 22px rgba(8,127,140,.2);flex:0 0 auto}.brand-mark svg{width:31px;height:31px}.brand-word{display:flex;align-items:baseline;gap:0;font-size:23px;line-height:1;font-weight:900;letter-spacing:-.055em;white-space:nowrap;color:#0d2430}.brand-word b{color:#087f8c;font-weight:900}.brand-word small{display:block;position:absolute;margin-top:31px;margin-left:1px;font-size:7px;letter-spacing:.16em;font-weight:900;color:#80939b}.brand-logo:hover .brand-mark{transform:translateY(-1px);box-shadow:0 12px 26px rgba(8,127,140,.26)}.brand-mark{transition:.2s}@media(max-width:560px){.brand-word{font-size:20px}.brand-word small{display:none}.brand-mark{width:39px;height:39px;border-radius:12px}.brand-mark svg{width:28px;height:28px}}</style></head>
<body><nav><div class="wrap nav"><a class="brand-logo" href="index.html"><span class="brand-mark"><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="20" fill="none" stroke="currentColor" stroke-width="2.5" opacity=".95"/><path d="M11 29c6-9 12-13 26-14M12 19c7 7 14 11 25 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".7"/><circle cx="13" cy="29" r="2.7" fill="currentColor"/><circle cx="36" cy="15" r="2.7" fill="currentColor"/><circle cx="37" cy="30" r="2.7" fill="currentColor"/><path d="M17 34c2.8-2.8 5.5-4.2 8.2-4.2 3.1 0 5.1 1.1 7.2 3.1" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></span><span class="brand-word"><span>Supply</span><b>Desk</b><small>GLOBAL SUPPLY NETWORK</small></span></a><div style="display:flex;gap:8px"><a class="btn" href="categories.html">Categories</a><a class="btn primary" href="supplier-register.html">Register Supplier</a></div></div></nav>
<main class="wrap"><section class="top"><div class="eyebrow">Supply discovery</div><h1 id="title">Explore SupplyDesk</h1><p>Find products, suppliers and supply services.</p><div class="search"><input id="q" placeholder="Product, material, supplier or service"><button class="btn primary" onclick="run()">Search</button></div></section>
<div class="tabs"><button class="tab active" data-type="all">All</button><button class="tab" data-type="product">Products</button><button class="tab" data-type="supplier">Suppliers</button><button class="tab" data-type="service">Services</button></div>
<div class="filters"><select id="category" onchange="render()"><option value="">Any category</option><option>Raw Materials</option><option>Plastics & Packaging</option><option>Machinery</option><option>Electronics & Components</option><option>Automotive</option><option>Textiles & Apparel</option><option>Food & Agriculture</option><option>Chemicals</option><option>Consumer Products</option><option>Construction Materials</option><option>Logistics & Freight</option><option>Warehousing & Fulfilment</option><option>Customs & Trade</option><option>Inspection & Verification</option><option>Insurance</option><option>Trade Finance</option><option>Sourcing Services</option><option>Professional Services</option></select><select id="subcategory" onchange="render()"><option value="">Any sub-category</option></select><select id="country" onchange="render()"><option value="">Any country</option><option>India</option><option>China</option><option>UAE</option><option>USA</option></select><select id="city" onchange="render()"><option value="">Any city</option><option>Delhi</option><option>Mumbai</option><option>Ahmedabad</option><option>Yiwu</option><option>Dubai</option><option>Shenzhen</option></select><select id="market" onchange="render()"><option value="">Any market</option><option>Domestic</option><option>International</option></select></div>
<div class="summary" id="summary"></div><section id="results"></section><div class="footer">SupplyDesk is an information and connection platform. Listings and business details are shown for discovery.</div></main>
<script>
const demoData=[
{id:'abc-plastics',name:'ABC Plastics Manufacturing',type:'supplier',city:'Yiwu',country:'China',market:'International',desc:'Manufacturer of household plastic products and kitchen storage items.',category:'Plastics & Packaging',subcategories:['Plastic Containers','Kitchenware'],tags:['Plastic containers','Kitchenware','Manufacturer']},
{id:'india-growth',name:'India Growth Industries',type:'supplier',city:'Ahmedabad',country:'India',market:'Domestic',desc:'Indian manufacturer of plastic household and industrial articles.',category:'Plastics & Packaging',subcategories:['Plastic Containers','Household Products'],tags:['Household','Plastics','Manufacturing']},
{id:'asia-components',name:'Asia Components',type:'supplier',city:'Shenzhen',country:'China',market:'International',desc:'Electronics components supplier serving domestic and export markets.',category:'Electronics & Components',subcategories:['Electronic Components','OEM'],tags:['Electronics','Components','OEM']},
{id:'dubai-trading',name:'Dubai General Trading',type:'supplier',city:'Dubai',country:'UAE',market:'Domestic',desc:'General trading and distribution company serving the UAE market.',category:'Construction Materials',subcategories:['Building Materials','Distribution'],tags:['Trading','Distribution','Building materials']},
{id:'plastic-container',name:'Plastic Storage Container',type:'product',city:'Ahmedabad',country:'India',market:'Domestic',desc:'Example product listing with category, market and supplier connection.',category:'Plastics & Packaging',subcategories:['Plastic Containers','Household Products'],tags:['Storage','Plastic','Household']},
{id:'freight-forwarding',name:'Freight Forwarding Provider',type:'service',city:'Dubai',country:'UAE',market:'International',desc:'Example logistics service provider for international cargo movements.',category:'Logistics & Freight',subcategories:['Freight Forwarding','International Logistics'],tags:['Freight','Logistics','International']}
];
let data=[...demoData];
const params=new URLSearchParams(location.search);
document.getElementById('q').value=params.get('q')||'';
let active=params.get('type')||'all';

document.querySelectorAll('.tab').forEach(b=>{
  b.classList.toggle('active',b.dataset.type===active);
  b.onclick=()=>{
    active=b.dataset.type;
    document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.type===active));
    render();
  };
});

function run(){
  const q=document.getElementById('q').value.trim();
  location.href=q?'search.html?q='+encodeURIComponent(q):'search.html';
}

function match(x,q){
  return !q || (x.name+' '+x.desc+' '+x.tags.join(' ')).toLowerCase().includes(q.toLowerCase());
}

function target(x){
  return x.type==='supplier'?'supplier.html?id='+encodeURIComponent(x.id):x.type==='product'?'product.html?id='+encodeURIComponent(x.id):'service.html?id='+encodeURIComponent(x.id);
}

function esc(v){
  return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render(){
  const q=document.getElementById('q').value.trim(),
        cat=document.getElementById('category').value,
        sub=document.getElementById('subcategory').value,
        country=document.getElementById('country').value,
        city=document.getElementById('city').value,
        market=document.getElementById('market').value;

  const rows=data.filter(x=>
    (active==='all'||x.type===active) &&
    (!cat||x.category===cat) &&
    (!sub||x.subcategories?.includes(sub)) &&
    (!country||x.country===country) &&
    (!city||x.city===city) &&
    (!market||x.market===market||x.market==='All markets'||x.market==='Both') &&
    match(x,q)
  );

  document.getElementById('title').textContent=q?'Results for “'+q+'”':'Explore SupplyDesk';
  document.getElementById('summary').textContent=rows.length+' result'+(rows.length===1?'':'s')+' · Products, suppliers and services';

  document.getElementById('results').innerHTML=rows.length
    ?rows.map(x=>'<article class="result"><div class="result-main"><div class="type">'+esc(x.type)+(x.verified?' · ✓ Verified':'')+'</div><h3>'+esc(x.name)+'</h3><div class="meta">📍 '+esc(x.city)+', '+esc(x.country)+' · '+esc(x.market)+'</div><div class="desc">'+esc(x.desc)+'</div><div class="tags">'+x.tags.map(t=>'<span class="tag">'+esc(t)+'</span>').join('')+'</div></div><div class="result-actions"><a class="btn primary view" href="'+target(x)+'">View '+(x.type==='product'?'Product':x.type==='service'?'Service':'Supplier')+' →</a></div></article>').join('')
    :'<div class="empty"><h3>No exact matches yet</h3><p>Try a broader term, another market, or clear the filters.</p><button class="btn" onclick="clearFilters()">Clear filters</button></div>';
}

function clearFilters(){
  document.getElementById('category').value='';
  document.getElementById('subcategory').innerHTML='<option value="">Any sub-category</option>';
  document.getElementById('country').value='';
  document.getElementById('city').value='';
  document.getElementById('market').value='';
  active='all';
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.type==='all'));
  render();
}

document.getElementById('category').onchange=()=>{
  const map={
    'Plastics & Packaging':['Plastic Containers','Plastic Bottles','Packaging Films','Plastic Components'],
    'Machinery':['Injection Moulding Machines','CNC Machines','Packaging Machines'],
    'Electronics & Components':['Electronic Components','PCB','Power Supplies'],
    'Logistics & Freight':['Sea Freight','Air Freight','Road Transport','Freight Forwarding'],
    'Construction Materials':['Building Materials','Tiles & Surfaces','Plumbing Products'],
    'Raw Materials':['Metals','Minerals','Polymers'],
    'Automotive':['Auto Components','Accessories','Aftermarket Parts'],
    'Textiles & Apparel':['Fabrics','Garments','Home Textiles'],
    'Food & Agriculture':['Food Ingredients','Agri Products','Processed Food'],
    'Chemicals':['Industrial Chemicals','Specialty Chemicals'],
    'Inspection & Verification':['Factory Inspection','Pre-shipment Inspection'],
    'Insurance':['Cargo Insurance','Transit Insurance'],
    'Trade Finance':['Trade Finance','Letter of Credit'],
    'Warehousing & Fulfilment':['Warehousing','Consolidation'],
    'Customs & Trade':['Customs Clearance','Trade Documentation'],
    'Sourcing Services':['Product Sourcing','Supplier Discovery'],
    'Professional Services':['Consulting','Accounting & Tax']
  };
  document.getElementById('subcategory').innerHTML='<option value="">Any sub-category</option>'+(map[this.value]||[]).map(x=>'<option>'+esc(x)+'</option>').join('');
  render();
};

async function loadLiveData(){
  try{
    const [supplierResponse,productResponse]=await Promise.all([fetch('/api/suppliers'),fetch('/api/products')]);
    const suppliers=supplierResponse.ok?(await supplierResponse.json()).suppliers||[]:[];
    const products=productResponse.ok?(await productResponse.json()).products||[]:[];
    data=[...suppliers.map(x=>({...x,market:x.market||'All markets'})),...products.map(x=>({...x,market:x.market||'All markets'})),...demoData];
  }catch(e){}
  render();
}

render();
loadLiveData();</script></body></html>
