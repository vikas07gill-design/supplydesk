<style>
:root{--ink:#0d2430;--muted:#647780;--line:#dbe7eb;--bg:#f5fafb;--card:#fff;--brand:#087f8c;--dark:#092a38}.wrap{max-width:1120px;margin:auto;padding:0 20px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}a{text-decoration:none;color:inherit}nav{height:70px;background:rgba(255,255,255,.94);border-bottom:1px solid var(--line);display:flex;align-items:center;position:sticky;top:0;z-index:20;backdrop-filter:blur(12px)}.nav{width:100%;display:flex;justify-content:space-between;align-items:center}.logo{font-size:21px;font-weight:900;letter-spacing:-.04em}.logo span{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#2fd0bd,#2377b7);color:#fff;margin-right:8px}.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 15px;font-weight:800;cursor:pointer;color:var(--ink)}.primary{background:var(--brand);border-color:var(--brand);color:#fff}.top{padding:43px 0 18px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--brand);font-weight:900}.top h1{font-size:clamp(32px,4vw,46px);letter-spacing:-.05em;margin:10px 0 7px}.top p{margin:0;color:var(--muted)}.search{display:flex;gap:9px;margin-top:22px}.search input{flex:1;height:52px;border:1px solid var(--line);border-radius:12px;padding:0 15px;font:inherit;background:#fff;outline:none}.search input:focus{border-color:#83cfc6;box-shadow:0 0 0 4px rgba(8,127,140,.08)}.tabs{display:flex;gap:8px;margin:20px 0 14px}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 15px;color:var(--muted);font-size:13px;cursor:pointer}.tab.active{background:#e8f7f5;color:var(--brand);border-color:#bfe4df;font-weight:800}.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:19px}.filters select{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px;color:var(--muted)}.sort-wrap{margin-left:auto;display:flex;align-items:center;gap:8px}.sort-wrap span{font-size:12px;color:var(--muted);font-weight:700}.summary{font-size:13px;color:var(--muted);margin:12px 0}.result{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px;display:flex;justify-content:space-between;gap:20px;transition:.2s;overflow:hidden}.result:hover{border-color:#9fd3cc;box-shadow:0 18px 42px rgba(13,36,48,.1);transform:translateY(-3px)}.result-main{min-width:0}.type{display:inline-flex;align-items:center;gap:6px;font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--brand);font-weight:900;margin-bottom:8px}.type:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}.result h3{margin:0 0 5px;font-size:19px;letter-spacing:-.02em}.meta{color:var(--muted);font-size:13px}.desc{color:#71828a;font-size:13px;line-height:1.55;margin:9px 0 0;max-width:700px}.tags{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}.tag{font-size:11px;background:#f1f6f7;border-radius:999px;padding:6px 8px;color:#526770}.result-actions{display:flex;align-items:center}.view{white-space:nowrap}.product-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.product-grid .result{display:block;padding:0;margin:0}.product-grid .result:hover{transform:translateY(-5px)}.product-card-image{height:205px;background:linear-gradient(145deg,#eaf8f8,#edf4fc);position:relative;overflow:hidden}.product-card-image img{width:100%;height:100%;display:block;object-fit:cover}.product-card-image.placeholder{display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,rgba(56,216,213,.22),transparent 25%),linear-gradient(145deg,#071b30,#0c4565)}.product-card-image.placeholder:before{content:"PRODUCT";font-size:12px;letter-spacing:.2em;font-weight:900;color:#75e2e1}.product-card-body{padding:17px}.product-card-body h3{font-size:20px;line-height:1.18;min-height:48px}.product-card-body .desc{min-height:40px}.product-card-body .meta{margin-top:9px}.product-card-body .tags{margin-top:12px}.product-card-body .result-actions{margin-top:16px}.product-card-body .view{width:100%}.verified-badge{display:inline-flex;align-items:center;gap:5px;background:#e9faf7;color:#078d86;border:1px solid #cceee8;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:900}.moq{font-size:12px;color:#526770;margin-top:10px;font-weight:700}.empty{padding:55px;text-align:center;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:17px}.empty h3{color:var(--ink);margin-top:0}.load-more{display:flex;justify-content:center;margin:22px 0 4px}.footer{padding:35px 0;color:#7b8c94;font-size:12px}@media(max-width:900px){.product-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){.result{display:block}.result-actions{margin-top:15px}.search{flex-direction:column}.tabs{overflow:auto}.view{width:100%}.product-grid{grid-template-columns:1fr}.product-card-image{height:220px}}
.brand-logo{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0}.brand-mark{width:43px;height:43px;border-radius:14px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,#087f8c,#176aa5);box-shadow:0 9px 22px rgba(8,127,140,.2);flex:0 0 auto}.brand-mark svg{width:31px;height:31px}.brand-word{display:flex;align-items:baseline;gap:0;font-size:23px;line-height:1;font-weight:900;letter-spacing:-.055em;white-space:nowrap;color:#0d2430}.brand-word b{color:#087f8c;font-weight:900}.brand-word small{display:block;position:absolute;margin-top:31px;margin-left:1px;font-size:7px;letter-spacing:.16em;font-weight:900;color:#80939b}.brand-logo:hover .brand-mark{transform:translateY(-1px);box-shadow:0 12px 26px rgba(8,127,140,.26)}.brand-mark{transition:.2s}@media(max-width:560px){.brand-word{font-size:20px}.brand-word small{display:none}.brand-mark{width:39px;height:39px;border-radius:12px}.brand-mark svg{width:28px;height:28px}}</style><style>
/* SupplyDesk 3D visual system */
body{background:linear-gradient(180deg,#f2f8fc 0%,#f8fbfd 55%,#eef7fa 100%)}
nav{background:rgba(5,20,35,.9)!important;border-bottom-color:rgba(255,255,255,.08)!important;box-shadow:0 8px 30px rgba(3,24,40,.14)}
nav .brand-word,nav .brand-word span{color:#fff!important}nav .brand-word b{color:#45d9ea!important}
nav .btn:not(.primary){background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.14);color:#fff}
nav .brand-mark{background:linear-gradient(145deg,#159de7,#0a6ee8 55%,#14cdbb)!important;box-shadow:0 8px 28px rgba(25,156,231,.3)}
.top{position:relative;margin:24px 0 18px;padding:42px 38px;border-radius:25px;overflow:hidden;color:#fff;background:radial-gradient(circle at 84% 28%,rgba(40,153,255,.26),transparent 25%),linear-gradient(135deg,#06172a,#0a3453)}
.top:after{content:"";position:absolute;width:300px;height:300px;right:-110px;top:-130px;border:1px solid rgba(66,220,236,.18);border-radius:50%;box-shadow:0 0 70px rgba(36,133,255,.12)}
.top h1{position:relative;z-index:1;color:#fff}.top p{position:relative;z-index:1;color:#b8cad5}
.top .eyebrow{position:relative;z-index:1;color:#61e3e7}.search{position:relative;z-index:3}.search input{box-shadow:0 12px 30px rgba(4,27,45,.09)}
.tabs{margin-top:22px}.tab{transition:.2s}.tab.active{background:linear-gradient(135deg,#e5fbfa,#e8f1ff);box-shadow:0 7px 18px rgba(14,113,156,.08)}
.filters select{box-shadow:0 7px 18px rgba(17,66,90,.04);cursor:pointer}
.result{position:relative;overflow:hidden;border-radius:20px;padding:22px;box-shadow:0 10px 30px rgba(11,58,80,.04);transition:.24s}
.result:before{content:"";position:absolute;width:90px;height:90px;right:-42px;top:-42px;border-radius:50%;background:rgba(35,130,255,.06)}
.result:hover{transform:translateY(-4px);box-shadow:0 22px 45px rgba(9,58,82,.1);border-color:#9bdfe1}
.result h3{font-size:21px}.type{color:#058d9a}.type:before{background:#27cdb9;box-shadow:0 0 0 5px rgba(39,205,185,.1)}
.view{background:linear-gradient(135deg,#16b9d1,#287bf4);border-color:transparent;box-shadow:0 9px 22px rgba(39,132,238,.2)}
.tag{background:linear-gradient(135deg,#eefaf9,#eef4fb);border:1px solid #e1edf0}
.summary{font-weight:700;color:#607985}

@media(max-width:650px){.top{padding:30px 22px;border-radius:20px}.top h1{font-size:35px}}
</style></head>
<body><nav><div class="wrap nav"><a class="brand-logo" href="index.html" aria-label="SupplyDesk home"><img src="assets/supplydesk-logo.svg" alt="SupplyDesk" style="width:180px;height:auto;display:block"></a><div style="display:flex;gap:8px"><a class="btn" href="categories.html">Categories</a><a class="btn primary" href="supplier-register.html">Register Supplier</a></div></div></nav>
<main class="wrap"><section class="top"><div class="eyebrow">Supply discovery</div><h1 id="title">Explore SupplyDesk</h1><p>Find products, suppliers and supply services.</p><div class="search"><input id="q" placeholder="Product, material, supplier or service"><button class="btn primary" onclick="run()">Search</button></div></section>
<div class="tabs"><button class="tab active" data-type="all">All</button><button class="tab" data-type="product">Products</button><button class="tab" data-type="supplier">Suppliers</button><button class="tab" data-type="service">Services</button></div>
<div class="filters"><select id="category" onchange="render()"><option value="">Any category</option><option>Raw Materials</option><option>Plastics & Packaging</option><option>Machinery</option><option>Electronics & Components</option><option>Automotive</option><option>Textiles & Apparel</option><option>Food & Agriculture</option><option>Chemicals</option><option>Consumer Products</option><option>Construction Materials</option><option>Logistics & Freight</option><option>Warehousing & Fulfilment</option><option>Customs & Trade</option><option>Inspection & Verification</option><option>Insurance</option><option>Trade Finance</option><option>Sourcing Services</option><option>Professional Services</option></select><select id="subcategory" onchange="render()"><option value="">Any sub-category</option></select><select id="country" onchange="render()"><option value="">Any country</option><option>India</option><option>China</option><option>UAE</option><option>USA</option></select><select id="city" onchange="render()"><option value="">Any city</option><option>Delhi</option><option>Mumbai</option><option>Ahmedabad</option><option>Yiwu</option><option>Dubai</option><option>Shenzhen</option></select><select id="market" onchange="render()"><option value="">Any market</option><option>Domestic</option><option>International</option><option>Both</option></select><div class="sort-wrap"><span>Sort</span><select id="sort" onchange="render()"><option value="newest">Newest</option><option value="name">Name A–Z</option></select></div></div>
<div class="summary" id="summary"></div><section id="results"></section><div class="footer">SupplyDesk is an information and connection platform. Listings and business details are shown for discovery.</div></main>
<script>
let data=[];
const params=new URLSearchParams(location.search);
document.getElementById('q').value=params.get('q')||'';
let active=params.get('type')||'all';

document.querySelectorAll('.tab').forEach(b=>{
  b.classList.toggle('active',b.dataset.type===active);
  b.onclick=()=>{
    active=b.dataset.type;
    document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.type===active));
    render();
  };
});

function run(){
  const q=document.getElementById('q').value.trim();
  location.href=q?'search.html?q='+encodeURIComponent(q):'search.html';
}

function match(x,q){
  return !q || (x.name+' '+x.desc+' '+x.tags.join(' ')).toLowerCase().includes(q.toLowerCase());
}

function target(x){
  return x.type==='supplier'?'supplier.html?id='+encodeURIComponent(x.id):x.type==='product'?'product.html?id='+encodeURIComponent(x.id):'service.html?id='+encodeURIComponent(x.id);
}

function esc(v){
  return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render(){
  const q=document.getElementById('q').value.trim(),
        cat=document.getElementById('category').value,
        sub=document.getElementById('subcategory').value,
        country=document.getElementById('country').value,
        city=document.getElementById('city').value,
        market=document.getElementById('market').value,
        sort=document.getElementById('sort')?.value||'newest';

  let rows=data.filter(x=>
    (active==='all'||active==='category'||x.type===active) &&
    (!cat||x.category===cat) &&
    (!sub||x.subcategories?.includes(sub)) &&
    (!country||x.country===country) &&
    (!city||x.city===city) &&
    (!market||x.market===market||x.market==='All markets'||x.market==='Both') &&
    match(x,q)
  );

  rows.sort((a,b)=>sort==='name'?String(a.name).localeCompare(String(b.name)):0);

  document.getElementById('title').textContent=q?'Results for “'+q+'”':'Explore SupplyDesk';
  document.getElementById('summary').textContent=rows.length+' result'+(rows.length===1?'':'s')+' · Products, suppliers and services';

  if(!rows.length){
    document.getElementById('results').innerHTML='<div class="empty"><h3>No exact matches yet</h3><p>Try a broader term, another market, or clear the filters.</p><button class="btn" onclick="clearFilters()">Clear filters</button></div>';
    return;
  }

  const productRows=rows.filter(x=>x.type==='product');
  const otherRows=rows.filter(x=>x.type!=='product');

  const productHtml=productRows.map(x=>{
    const image=x.imageUrl
      ?'<div class="product-card-image"><img loading="lazy" src="'+esc(x.imageUrl)+'" alt="'+esc(x.name)+'"></div>'
      :'<div class="product-card-image placeholder"></div>';
    return '<article class="result">'+
      image+
      '<div class="product-card-body"><div class="type">PRODUCT</div>'+
      '<h3>'+esc(x.name)+'</h3>'+
      '<div><span class="verified-badge">✓ SupplyDesk Verified</span></div>'+
      '<div class="meta">📍 '+esc(x.city)+', '+esc(x.country)+' · '+esc(x.market)+'</div>'+
      (x.moq?'<div class="moq">MOQ: '+esc(x.moq)+(x.unit?' '+esc(x.unit):'')+'</div>':'')+
      '<div class="desc">'+esc(x.desc)+'</div>'+
      '<div class="tags">'+x.tags.map(t=>'<span class="tag">'+esc(t)+'</span>').join('')+'</div>'+
      '<div class="result-actions"><a class="btn primary view" href="'+target(x)+'">View Product →</a></div></div></article>';
  }).join('');

  const otherHtml=otherRows.map(x=>'<article class="result"><div class="result-main"><div class="type">'+esc(x.type)+(x.verified?' · ✓ Verified':'')+'</div><h3>'+esc(x.name)+'</h3><div class="meta">📍 '+esc(x.city)+', '+esc(x.country)+' · '+esc(x.market)+'</div><div class="desc">'+esc(x.desc)+'</div><div class="tags">'+x.tags.map(t=>'<span class="tag">'+esc(t)+'</span>').join('')+'</div></div><div class="result-actions"><a class="btn primary view" href="'+target(x)+'">View '+(x.type==='service'?'Service':'Supplier')+' →</a></div></article>').join('');

  document.getElementById('results').innerHTML=(productHtml?'<div class="product-grid">'+productHtml+'</div>':'')+(otherHtml?(productHtml?'<div style="margin:30px 0 12px;font-size:13px;font-weight:900;color:#607985">SUPPLIERS & SERVICES</div>':'')+otherHtml:'');
}

function clearFilters(){
  document.getElementById('category').value='';
  document.getElementById('subcategory').innerHTML='<option value="">Any sub-category</option>';
  document.getElementById('country').value='';
  document.getElementById('city').value='';
  document.getElementById('market').value='';
  if(document.getElementById('sort'))document.getElementById('sort').value='newest';
  active='all';
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.type==='all'));
  render();
}

document.getElementById('category').onchange=()=>{
  const map={
    'Plastics & Packaging':['Plastic Containers','Plastic Bottles','Packaging Films','Plastic Components'],
    'Machinery':['Injection Moulding Machines','CNC Machines','Packaging Machines'],
    'Electronics & Components':['Electronic Components','PCB','Power Supplies'],
    'Logistics & Freight':['Sea Freight','Air Freight','Road Transport','Freight Forwarding'],
    'Construction Materials':['Building Materials','Tiles & Surfaces','Plumbing Products'],
    'Raw Materials':['Metals','Minerals','Polymers'],
    'Automotive':['Auto Components','Accessories','Aftermarket Parts'],
    'Textiles & Apparel':['Fabrics','Garments','Home Textiles'],
    'Food & Agriculture':['Food Ingredients','Agri Products','Processed Food'],
    'Chemicals':['Industrial Chemicals','Specialty Chemicals'],
    'Inspection & Verification':['Factory Inspection','Pre-shipment Inspection'],
    'Insurance':['Cargo Insurance','Transit Insurance'],
    'Trade Finance':['Trade Finance','Letter of Credit'],
    'Warehousing & Fulfilment':['Warehousing','Consolidation'],
    'Customs & Trade':['Customs Clearance','Trade Documentation'],
    'Sourcing Services':['Product Sourcing','Supplier Discovery'],
    'Professional Services':['Consulting','Accounting & Tax']
  };
  document.getElementById('subcategory').innerHTML='<option value="">Any sub-category</option>'+(map[this.value]||[]).map(x=>'<option>'+esc(x)+'</option>').join('');
  render();
};

async function loadLiveData(){
  try{
    const [supplierResponse,productResponse]=await Promise.all([fetch('/api/suppliers'),fetch('/api/products')]);
    const suppliers=supplierResponse.ok?(await supplierResponse.json()).suppliers||[]:[];
    const products=productResponse.ok?(await productResponse.json()).products||[]:[];
    data=[...suppliers.map(x=>({...x,market:x.market||'All markets'})),...products.map(x=>({...x,market:x.market||'All markets'}))];
  }catch(e){}
  render();
}

render();
loadLiveData();</script></body></html>
