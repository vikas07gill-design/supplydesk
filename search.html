<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Search | SupplyDesk</title><style>
:root{--ink:#10242d;--muted:#667780;--line:#dce6ea;--bg:#f6f9fb;--brand:#087f8c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}.wrap{max-width:1080px;margin:auto;padding:0 20px}nav{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center}.nav{display:flex;justify-content:space-between;align-items:center;width:100%}.logo{font-size:21px;font-weight:850}.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 14px;font-weight:700}.primary{background:var(--brand);border-color:var(--brand);color:#fff}.top{padding:35px 0 22px}.top h1{font-size:30px;margin:0 0 6px}.top p{margin:0;color:var(--muted)}.search{display:flex;gap:9px;margin-top:20px}.search input{flex:1;height:48px;border:1px solid var(--line);border-radius:10px;padding:0 14px;font:inherit}.tabs{display:flex;gap:8px;margin:20px 0}.tab{background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 13px;color:var(--muted);font-size:13px}.tab.active{background:#e9f7f5;color:#087f8c;border-color:#bfe4df;font-weight:700}.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:18px}.filters select{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px;color:var(--muted)}.result{background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px;margin-bottom:11px;display:flex;justify-content:space-between;gap:20px}.result h3{margin:0 0 5px;font-size:17px}.meta{color:var(--muted);font-size:13px}.tags{display:flex;gap:6px;margin-top:11px;flex-wrap:wrap}.tag{font-size:11px;background:#f2f6f7;border-radius:7px;padding:5px 7px;color:#5b6e77}.empty{padding:45px;text-align:center;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:15px} @media(max-width:600px){.result{display:block}.result .btn{margin-top:14px}.search{flex-direction:column}}
</style></head><body><nav><div class="wrap nav"><a class="logo" href="index.html">SupplyDesk</a><a class="btn" href="services.html">Services</a></div></nav>
<main class="wrap"><section class="top"><h1 id="title">Search SupplyDesk</h1><p>Find a product, supplier or supply service.</p><div class="search"><input id="q" placeholder="What are you looking for?"><button class="btn primary" onclick="run()">Search</button></div></section>
<div class="tabs"><button class="tab active">All</button><button class="tab">Products</button><button class="tab">Suppliers</button><button class="tab">Services</button></div>
<div class="filters"><select><option>Any country</option><option>India</option><option>China</option><option>UAE</option><option>USA</option></select><select><option>Any city</option><option>Delhi</option><option>Mumbai</option><option>Yiwu</option><option>Dubai</option></select><select><option>Domestic or international</option><option>Domestic</option><option>International</option></select></div>
<section id="results"></section></main>
<script>
const params=new URLSearchParams(location.search);const initial=params.get('q')||'';document.getElementById('q').value=initial;function run(){const q=document.getElementById('q').value.trim();if(q)location.href='search.html?q='+encodeURIComponent(q)}
function render(){const q=initial||'your requirement';document.getElementById('title').textContent='Results for “'+q+'”';document.getElementById('results').innerHTML='<div class="result"><div><h3>Example Supplier</h3><div class="meta">Yiwu, China · Supplier</div><div class="tags"><span class="tag">'+q+'</span><span class="tag">Manufacturer</span></div></div><a class="btn" href="#">View & Contact</a></div><div class="result"><div><h3>Example Supplier</h3><div class="meta">Ahmedabad, India · Supplier</div><div class="tags"><span class="tag">'+q+'</span><span class="tag">Manufacturer</span></div></div><a class="btn" href="#">View & Contact</a></div><div class="result"><div><h3>Supply Service Provider</h3><div class="meta">Dubai, UAE · Service Provider</div><div class="tags"><span class="tag">Logistics</span><span class="tag">International</span></div></div><a class="btn" href="#">View & Contact</a></div>'}render();
</script></body></html>
