<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Supplier | SupplyDesk</title><style>:root{--ink:#10242d;--muted:#667780;--line:#dce6ea;--bg:#f6f9fb;--brand:#087f8c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}.wrap{max-width:1000px;margin:auto;padding:0 20px}nav{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center}.nav{display:flex;justify-content:space-between;align-items:center;width:100%}.logo{font-size:21px;font-weight:850}.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:#fff;border-radius:9px;padding:10px 15px;font-weight:700;color:var(--ink)}.primary{background:var(--brand);border-color:var(--brand);color:#fff}.back{padding:28px 0 12px;color:var(--brand);font-size:13px}.profile{background:#fff;border:1px solid var(--line);border-radius:18px;padding:25px}.head{display:flex;justify-content:space-between;gap:20px}.identity{display:flex;gap:15px}.avatar{width:62px;height:62px;border-radius:15px;background:linear-gradient(135deg,#dff7f3,#dcecf8);display:grid;place-items:center;font-size:22px;font-weight:850;color:var(--brand)}h1{margin:0 0 5px;font-size:28px}.meta{color:var(--muted);font-size:13px}.verified{display:inline-block;margin-top:10px;background:#e9f7f5;color:var(--brand);border-radius:999px;padding:5px 8px;font-size:11px;font-weight:700}.grid{display:grid;grid-template-columns:1.3fr .7fr;gap:16px;margin-top:16px}.box{background:#fff;border:1px solid var(--line);border-radius:15px;padding:21px}.box h2{font-size:19px;margin:0 0 12px}.box p{color:var(--muted);line-height:1.65;font-size:14px}.products{display:grid;grid-template-columns:1fr 1fr;gap:10px}.product{border:1px solid var(--line);border-radius:11px;padding:13px}.product b{font-size:14px}.product small{display:block;color:var(--muted);margin-top:5px}.contactbox{background:#eef8f7;border-color:#c9e7e2}.contactbox h2{margin-bottom:7px}.contactbox p{margin-top:0}.actions{display:flex;gap:8px;margin-top:15px}@media(max-width:700px){.head,.grid{display:block}.head .btn{margin-top:15px}.grid .box{margin-top:12px}.products{grid-template-columns:1fr}}</style></head><body>
