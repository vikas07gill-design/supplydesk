<!doctype html>

er:1px solid var(--line);border-radius:12px;padding:14px;background:#fbfdfe}.product b{font-size:14px}.product small{display:block;color:var(--muted);margin-top:5px}.contactbox{background:#eef8f7;border-color:#c9e7e2}.actions{display:flex;gap:8px;margin-top:15px}.contactbox p{margin-top:0}.note{font-size:11px!important}.related{margin-top:16px}.related a{display:block;padding:10px 0;border-bottom:1px solid var(--line);color:var(--brand);font-size:13px;font-weight:750}@media(max-width:700px){.head,.grid{display:block}.head .btn{margin-top:15px}.grid .box{margin-top:12px}.products{grid-template-columns:1fr}}

const id=new URLSearchParams(location.search).get("id")||"abc-plastics";
const profiles={
