<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SupplyDesk Admin Verification</title>
<style>
:root{--ink:#0d2430;--muted:#637680;--line:#dbe7eb;--bg:#f5fafb;--card:#fff;--brand:#087f8c;--danger:#b43d3d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}.wrap{max-width:1180px;margin:auto;padding:0 20px}header{background:#fff;border-bottom:1px solid var(--line);padding:18px 0}.head{display:flex;justify-content:space-between;gap:15px;align-items:center}h1{font-size:25px;margin:0}.muted{color:var(--muted);font-size:13px}.toolbar{display:flex;gap:8px;margin:18px 0;flex-wrap:wrap}.toolbar input,.toolbar select,.toolbar button,.detail button{padding:10px;border:1px solid var(--line);border-radius:9px;font:inherit}.toolbar button,.detail button{cursor:pointer;background:#fff;font-weight:800}.profile-review{display:grid;gap:8px;background:#f7fbfc;border:1px solid var(--line);border-radius:10px;padding:10px}.profile-review>div{display:grid;grid-template-columns:150px 1fr;gap:10px;padding:7px 0;border-bottom:1px solid #e7eff2;font-size:12px}.profile-review>div:last-child{border-bottom:0}.profile-review span{color:#667a83;font-weight:700}.profile-review strong{font-weight:700;white-space:pre-wrap;word-break:break-word}.toolbar .primary{background:var(--brand);color:#fff;border-color:var(--brand)}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:15px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px;overflow:auto}.row{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr 130px;gap:8px;align-items:center;padding:12px 0;border-bottom:1px solid #eef3f5;font-size:12px}.row.header{font-weight:900;color:#61747c}.row button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px;cursor:pointer;font-weight:800}.badge{display:inline-block;padding:4px 7px;border-radius:999px;background:#eaf7f5;color:#28636b;font-weight:800;font-size:11px}.detail h2{margin-top:0;font-size:19px}.kv{display:grid;grid-template-columns:145px 1fr;gap:8px;font-size:12px}.kv b{color:#667a83}.files a{display:block;color:var(--brand);font-size:12px;margin:7px 0}.status{padding:10px;border-radius:10px;background:#eef8f7;margin-bottom:12px;font-size:12px}.danger{color:var(--danger)}textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:9px;padding:10px;font:inherit}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions .approve{background:var(--brand);color:#fff;border-color:var(--brand)}@media(max-width:850px){.grid{grid-template-columns:1fr}.row{grid-template-columns:1.5fr 1fr 1fr 110px}.row.header{display:none}.row>div:nth-child(4){display:none}}
</style>
</head>
<body>
<header><div class="wrap head"><div><h1>SupplyDesk Admin</h1><div class="muted">Supplier verification & profile update queue</div></div><button id="logout">Clear Token</button></div></header>
<main class="wrap">
<div class="toolbar"><input id="adminId" placeholder="Admin ID"><input id="adminPassword" type="password" placeholder="Password"><button class="primary" onclick="login()">Sign In</button><span id="roleBadge" class="badge">Not signed in</span><select id="status"><option value="">All applications</option><option value="under_review">Under Review</option><option value="query">Query</option><option value="approved">Approved</option><option value="rejected">Rejected</option></select><button onclick="loadApps()">Applications</button><button id="updatesBtn" onclick="loadUpdates()" style="display:none">Supplier Updates</button><button id="testMailBtn" onclick="testEmail()" style="display:none">Test Email</button><button id="testSupplierMailBtn" onclick="testSupplierEmail()" style="display:none">Test Supplier Email</button><button id="testStorageBtn" onclick="testConnectionStorage()" style="display:none">Test Connection DB</button><button onclick="loadProducts()">Products</button></div>
<div id="message" class="muted"></div>
<div class="grid">
<section class="card"><div id="list">Enter your admin token to load applications.</div></section>
<section class="card detail" id="detail"><h2>Select an application</h2><div class="muted">Documents and legal details remain private to this admin area.</div></section>
</div>
</main>
<script>
const key="supplydesk_admin_token", roleKey="supplydesk_admin_role";
const adminIdInput=document.getElementById("adminId"), adminPasswordInput=document.getElementById("adminPassword");
function token(){return sessionStorage.getItem(key)||""}
function role(){return sessionStorage.getItem(roleKey)||""}
function applyRole(){const r=role();document.getElementById("roleBadge").textContent=r==="super_admin"?"SUPER ADMIN":"ADMIN";document.getElementById("updatesBtn").style.display=r?"inline-block":"none";document.getElementById("testMailBtn").style.display=r?"inline-block":"none";document.getElementById("testSupplierMailBtn").style.display=r?"inline-block":"none";document.getElementById("testStorageBtn").style.display=r?"inline-block":"none"}
async function login(){
  try{
    const r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({adminId:adminIdInput.value.trim(),password:adminPasswordInput.value})});
    const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"Login failed.");
    sessionStorage.setItem(key,d.token);sessionStorage.setItem(roleKey,d.role);adminPasswordInput.value="";applyRole();document.getElementById("message").textContent="Signed in successfully.";await loadApps();
  }catch(e){document.getElementById("message").textContent=e.message}
}
document.getElementById("logout").onclick=async()=>{try{if(token())await fetch("/api/admin/logout",{method:"POST",headers:{"x-admin-token":token()}})}catch{}sessionStorage.removeItem(key);sessionStorage.removeItem(roleKey);adminIdInput.value="";adminPasswordInput.value="";applyRole();document.getElementById("list").textContent="Sign in to load applications.";document.getElementById("detail").innerHTML="<h2>Select an application</h2>"};
async function api(url,options={}){const headers=Object.assign({"x-admin-token":token()},options.headers||{});const r=await fetch(url,Object.assign({},options,{headers}));const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||"Request failed");return data}
async function testEmail(){
  try{
    const recipient=prompt("Test email recipient:", "connect@supplydesk.in");
    if(!recipient)return;
    const data=await api("/api/admin/test-email",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({recipient})});
    document.getElementById("message").textContent="Test email sent to "+data.recipient+". Check the inbox.";
  }catch(e){document.getElementById("message").textContent=e.message}
}
async function testConnectionStorage(){
  try{
    const data=await api("/api/admin/test-connection-storage");
    const cols=(data.columns||[]).map(x=>x.field+" ("+x.type+")").join(", ");
    document.getElementById("message").textContent="Connection DB OK. Columns: "+cols;
  }catch(e){document.getElementById("message").textContent=e.message}
}
async function testSupplierEmail(){
  try{
    const supplierId=prompt("Supplier ID to test:", "ef22b165-cb89-4719-b7ca-03eb09e02828");
    if(!supplierId)return;
    const data=await api("/api/admin/test-supplier-email",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({supplierId:supplierId.trim()})});
    document.getElementById("message").textContent="Supplier email test sent to "+data.recipient+" for "+data.supplier+". Check that supplier inbox.";
  }catch(e){document.getElementById("message").textContent=e.message}
}
async function loadApps(){try{const q=document.getElementById("status").value;const data=await api("/api/admin/applications"+(q?"?status="+encodeURIComponent(q):""));document.getElementById("message").textContent="";renderList(data.applications)}catch(e){document.getElementById("message").textContent=e.message}}
function renderList(items){if(!items.length){document.getElementById("list").innerHTML="<div class='muted'>No applications found.</div>";return}document.getElementById("list").innerHTML='<div class="row header"><div>Business</div><div>Location</div><div>Category</div><div>Status</div><div></div></div>'+items.map(a=>`<div class="row"><div><strong>${esc(a.legal_name)}</strong><br><span class="muted">${esc(a.business_type)}</span></div><div>${esc(a.city)}, ${esc(a.country)}</div><div>${esc(a.category)}<br>${esc(a.subcategory)}</div><div><span class="badge">${esc(a.status)}</span></div><div><button onclick="openApp('${a.id}')">Review</button></div></div>`).join("")}
async function loadUpdates(){
  if(!role()){document.getElementById("message").textContent="Sign in as Admin or Super Admin to review supplier updates.";return}
  try{
    const data=await api("/api/admin/supplier-updates");
    document.getElementById("message").textContent="";
    renderUpdates(data.updates);
  }catch(e){document.getElementById("message").textContent=e.message}
}
function formatProfileDetails(v){const labels={about:"About",capabilities:"Capabilities",industries:"Industries Served",markets:"Markets Served",monthlyCapacity:"Monthly Capacity",leadTime:"Typical Lead Time",paymentTerms:"Payment Terms",incoterms:"Incoterms",shippingModes:"Shipping Modes",certifications:"Certifications",oem:"OEM Available",customManufacturing:"Custom Manufacturing"};if(!v||typeof v!=="object")return esc(v||"");return '<div class="profile-review">'+Object.entries(v).filter(([,value])=>value!==null&&value!==undefined&&String(value).trim()!=="").map(([k,value])=>'<div><span>'+esc(labels[k]||k)+'</span><strong>'+esc(Array.isArray(value)?value.join(", "):String(value))+'</strong></div>').join("")+'</div>';}
function formatChangeValue(k,v){return k==="profile_details"?formatProfileDetails(v):esc(Array.isArray(v)?v.join(", "):v);}
function renderUpdates(items){
  if(!items.length){document.getElementById("list").innerHTML="<div class='muted'>No supplier updates found.</div>";return}
  document.getElementById("list").innerHTML='<div class="row header"><div>Business</div><div>Location</div><div>Submitted</div><div>Status</div><div></div></div>'+items.map(u=>`<div class="row"><div><strong>${esc(u.trade_name||u.legal_name)}</strong><br><span class="muted">${esc(u.business_email)}</span></div><div>${esc(u.city)}, ${esc(u.country)}</div><div>${esc(new Date(u.created_at).toLocaleString())}</div><div><span class="badge">${esc(u.status)}</span></div><div><button onclick="openUpdate('${u.id}')">Review</button></div></div>`).join("");
}
async function loadProducts(){
  try{
    const data=await api("/api/admin/products?status=pending");
    document.getElementById("message").textContent="";
    renderProducts(data.products);
  }catch(e){document.getElementById("message").textContent=e.message}
}
function renderProducts(items){
  if(!items.length){document.getElementById("list").innerHTML="<div class='muted'>No pending product listings.</div>";return}
  document.getElementById("list").innerHTML='<div class="row header"><div>Product</div><div>Supplier</div><div>Category</div><div>Status</div><div></div></div>'+items.map(p=>`<div class="row"><div><strong>${esc(p.product_name)}</strong><br><span class="muted">${esc(p.market_scope)}</span></div><div>${esc(p.trade_name||p.legal_name)}<br><span class="muted">${esc(p.city)}, ${esc(p.country)}</span></div><div>${esc(p.category)}<br>${esc(p.subcategory)}</div><div><span class="badge">${esc(p.status)}</span></div><div><button onclick="openProductReview('${p.id}')">Review</button></div></div>`).join("");
}
async function openProductReview(id){
  try{
    const data=await api("/api/admin/products?status=pending");
    const p=(data.products||[]).find(x=>x.id===id);
    if(!p)throw new Error("Product not found.");
    const imgData=await api("/api/admin/products/"+encodeURIComponent(id)+"/images");
    const images=imgData.images||[];
    const imageHtml=images.length?'<div style="display:flex;gap:8px;flex-wrap:wrap">'+images.map(f=>'<div><div style="width:120px;height:90px;border-radius:9px;border:1px solid #dbe7eb;display:grid;place-items:center;font-size:11px;color:#637680">Product image</div><button style="margin-top:5px" onclick="viewProductImage(\''+f.id+'\')">Open</button><div class="muted">'+esc(f.status)+'</div></div>').join("")+'</div>':'<div class="muted">No product images uploaded.</div>';
    document.getElementById("detail").innerHTML=`<h2>${esc(p.product_name)}</h2><div class="status"><strong>Status:</strong> ${esc(p.status)}</div><div class="kv"><b>Supplier</b><span>${esc(p.trade_name||p.legal_name)}</span><b>Location</b><span>${esc(p.city)}, ${esc(p.country)}</span><b>Category</b><span>${esc(p.category)} → ${esc(p.subcategory)}</span><b>Market</b><span>${esc(p.market_scope)}</span><b>MOQ</b><span>${esc(p.moq||"Not provided")}</span><b>Unit</b><span>${esc(p.unit||"Not provided")}</span><b>Description</b><span>${esc(p.description||"Not provided")}</span></div><h3>Product images</h3>${imageHtml}<h3>Admin decision</h3><textarea id="productNotes" placeholder="Verification notes">${esc(p.admin_notes||"")}</textarea><div class="actions"><button class="approve" onclick="setProductStatus('${p.id}','approved')">Approve & Publish</button><button class="danger" onclick="setProductStatus('${p.id}','rejected')">Reject</button></div>`;
  }catch(e){document.getElementById("message").textContent=e.message}
}
async function viewProductImage(id){
  try{
    const r=await fetch("/api/admin/product-files/"+encodeURIComponent(id),{headers:{"x-admin-token":token()}});
    if(!r.ok)throw new Error("Could not open image.");
    const blob=await r.blob(),url=URL.createObjectURL(blob);window.open(url,"_blank","noopener");setTimeout(()=>URL.revokeObjectURL(url),60000);
  }catch(e){document.getElementById("message").textContent=e.message}
}
async function setProductStatus(id,status){
  try{
    const notes=document.getElementById("productNotes")?.value||"";
    await api("/api/admin/products/"+id,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({status,adminNotes:notes})});
    document.getElementById("message").textContent=status==="approved"?"Product approved and published.":"Product rejected.";
    await loadProducts();
  }catch(e){document.getElementById("message").textContent=e.message}
}
async function openUpdate(id){
  try{
    const d=await api("/api/admin/supplier-updates/"+id),u=d.update,p=d.payload||{};
    const labels={legal_name:"Legal name",trade_name:"Trade / brand",business_type:"Business type",country:"Country",city:"City",address:"Address",business_email:"Business email",business_phone:"Business phone",contact_person:"Contact person",designation:"Designation",website:"Website",category:"Category",subcategory:"Sub-category",profile_details:"Business Profile"};
    const changes=Object.keys(p).length?Object.entries(p).map(([k,v])=>k==="profile_details"?`<b>${esc(labels[k])}</b><div>${formatChangeValue(k,v)}</div>`:`<b>${esc(labels[k]||k)}</b><span>${formatChangeValue(k,v)}</span>`).join(""):"<span class='muted'>Documents only</span>";
    document.getElementById("detail").innerHTML=`<h2>${esc(u.trade_name||u.legal_name)}</h2><div class="status"><strong>Update status:</strong> ${esc(u.status)}</div><h3>Requested changes</h3><div class="kv">${changes}</div><h3>New documents</h3><div class="files">${d.files.length?d.files.map(f=>`<div>${esc(f.file_type)} · ${esc(f.original_name)} · ${Math.round(f.file_size/1024)} KB <button onclick="viewUpdateFile('${f.id}')">View</button></div>`).join(""):"<span class='muted'>No new documents.</span>"}</div><h3>Admin decision</h3><textarea id="notes" placeholder="Verification notes">${esc(u.admin_notes||"")}</textarea><div class="actions"><button class="approve" onclick="setUpdateStatus('${u.id}','approved')">Approve & Publish</button><button onclick="setUpdateStatus('${u.id}','query')">Query</button><button class="danger" onclick="setUpdateStatus('${u.id}','rejected')">Reject</button></div>`;
  }catch(e){document.getElementById("message").textContent=e.message}
}
async function setUpdateStatus(id,status){
  try{
    const notes=document.getElementById("notes")?.value||"";
    await api("/api/admin/supplier-updates/"+id,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({status,adminNotes:notes})});
    document.getElementById("message").textContent=status==="approved"?"Supplier update approved and published.":"Supplier update reviewed.";
    await loadUpdates(); await openUpdate(id);
  }catch(e){document.getElementById("message").textContent=e.message}
}
async function viewUpdateFile(id){
  if(role()!=="super_admin"){document.getElementById("message").textContent="Only Super Admin can view supplier documents.";return}
  try{
    const r=await fetch("/api/admin/supplier-update-files/"+encodeURIComponent(id),{headers:{"x-admin-token":token()}});
    if(!r.ok)throw new Error("Could not open file.");
    const blob=await r.blob(),url=URL.createObjectURL(blob);window.open(url,"_blank","noopener");setTimeout(()=>URL.revokeObjectURL(url),60000);
  }catch(e){document.getElementById("message").textContent=e.message}
}
async function openApp(id){
  try{
    const d=role()==="super_admin"?await api("/api/super-admin/applications/"+id):await api("/api/admin/applications/"+id);
    const a=d.application, confidential=role()==="super_admin", files=d.files||[];
    const fileHtml=confidential?(files.length?files.map(f=>"<div>"+esc(f.file_type)+" · "+esc(f.original_name)+" · "+Math.round(f.file_size/1024)+" KB <button onclick=\"viewFile('"+f.id+"')\">View</button></div>").join(""):"<span class='muted'>No files uploaded.</span>"):"<span class='muted'>Confidential documents are visible only to Super Admin.</span>";
    const privateHtml=confidential?("<b>Contact</b><span>"+esc(a.contact_person)+" · "+esc(a.designation||"")+"</span><b>Email</b><span>"+esc(a.business_email)+"</span><b>Phone</b><span>"+esc(a.business_phone)+"</span><b>Registration</b><span>"+esc(a.registration_number||"Not provided")+"</span><b>Tax/VAT/GST</b><span>"+esc(a.tax_number||"Not provided")+"</span><b>Import/Export</b><span>"+esc(a.import_export_number||"Not provided")+"</span>"):"<b>Access</b><span>Basic supplier information only</span>";
    document.getElementById("detail").innerHTML="<h2>"+esc(a.legal_name)+"</h2><div class='status'><strong>Status:</strong> "+esc(a.status)+"</div><div class='kv'><b>Business type</b><span>"+esc(a.business_type)+"</span><b>Location</b><span>"+esc(a.city)+", "+esc(a.country)+"</span><b>Address</b><span>"+esc(a.address)+"</span>"+privateHtml+"<b>Category</b><span>"+esc(a.category)+" → "+esc(a.subcategory)+"</span><b>Website</b><span>"+(a.website?"<a href=\""+esc(a.website)+"\" target=\"_blank\" rel=\"noopener\">"+esc(a.website)+"</a>":"Not provided")+"</span></div><h3>Uploaded documents</h3><div class='files'>"+fileHtml+"</div>"+(confidential?"<h3>Super Admin: Supplier Email</h3><div style='display:flex;gap:8px;max-width:620px'><input id='supplierEmail' value='"+esc(a.business_email||"")+"' style='flex:1'><button class='primary' onclick=\"updateSupplierEmail('"+a.id+"')\">Update Email</button></div><p class='muted'>Changing this email updates dashboard and secure supplier access.</p>":"")+"<h3>Admin decision</h3><textarea id='notes' placeholder='Verification notes'>"+esc(a.admin_notes||"")+"</textarea><div class='actions'><button class='approve' onclick=\"setStatus('"+a.id+"','approved')\">Approve & Publish</button><button onclick=\"setStatus('"+a.id+"','query')\">Query</button><button class='danger' onclick=\"setStatus('"+a.id+"','rejected')\">Reject</button></div>";
  }catch(e){document.getElementById("message").textContent=e.message}
}
async function updateSupplierEmail(id){
  if(role()!=="super_admin"){document.getElementById("message").textContent="Super Admin access required.";return}
  const input=document.getElementById("supplierEmail"),email=input?.value.trim().toLowerCase();
  if(!email){document.getElementById("message").textContent="Enter a business email.";return}
  if(!confirm("Update this supplier's registered business email?"))return;
  try{
    const d=await api("/api/super-admin/suppliers/"+encodeURIComponent(id)+"/email",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({businessEmail:email})});
    document.getElementById("message").textContent=d.message;await openApp(id);
  }catch(e){document.getElementById("message").textContent=e.message}
}
async function setStatus(id,status){try{const notes=document.getElementById("notes")?.value||"";await api("/api/admin/applications/"+id,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({status,adminNotes:notes})});document.getElementById("message").textContent="Application updated.";await loadApps();await openApp(id)}catch(e){document.getElementById("message").textContent=e.message}}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function viewFile(id){
  if(role()!=="super_admin"){document.getElementById("message").textContent="Super Admin access required.";return}
  try{
    const r=await fetch("/api/admin/files/"+encodeURIComponent(id),{headers:{"x-admin-token":token()}});
    if(!r.ok) throw new Error("Could not open file.");
    const blob=await r.blob();
    const url=URL.createObjectURL(blob);
    window.open(url,"_blank","noopener");
    setTimeout(()=>URL.revokeObjectURL(url),60000);
  }catch(e){document.getElementById("message").textContent=e.message}
}
document.getElementById("status").onchange=loadApps;
applyRole(); if(sessionStorage.getItem(key)){loadApps()}
</script>
</body>
</html>
