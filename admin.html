<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SupplyDesk Admin Verification</title>
<style>
:root{--ink:#0d2430;--muted:#637680;--line:#dbe7eb;--bg:#f5fafb;--card:#fff;--brand:#087f8c;--danger:#b43d3d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}.wrap{max-width:1180px;margin:auto;padding:0 20px}header{background:#fff;border-bottom:1px solid var(--line);padding:18px 0}.head{display:flex;justify-content:space-between;gap:15px;align-items:center}h1{font-size:25px;margin:0}.muted{color:var(--muted);font-size:13px}.toolbar{display:flex;gap:8px;margin:18px 0;flex-wrap:wrap}.toolbar input,.toolbar select,.toolbar button,.detail button{padding:10px;border:1px solid var(--line);border-radius:9px;font:inherit}.toolbar button,.detail button{cursor:pointer;background:#fff;font-weight:800}.toolbar .primary{background:var(--brand);color:#fff;border-color:var(--brand)}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:15px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px;overflow:auto}.row{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr 130px;gap:8px;align-items:center;padding:12px 0;border-bottom:1px solid #eef3f5;font-size:12px}.row.header{font-weight:900;color:#61747c}.row button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px;cursor:pointer;font-weight:800}.badge{display:inline-block;padding:4px 7px;border-radius:999px;background:#eaf7f5;color:#28636b;font-weight:800;font-size:11px}.detail h2{margin-top:0;font-size:19px}.kv{display:grid;grid-template-columns:145px 1fr;gap:8px;font-size:12px}.kv b{color:#667a83}.files a{display:block;color:var(--brand);font-size:12px;margin:7px 0}.status{padding:10px;border-radius:10px;background:#eef8f7;margin-bottom:12px;font-size:12px}.danger{color:var(--danger)}textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:9px;padding:10px;font:inherit}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions .approve{background:var(--brand);color:#fff;border-color:var(--brand)}@media(max-width:850px){.grid{grid-template-columns:1fr}.row{grid-template-columns:1.5fr 1fr 1fr 110px}.row.header{display:none}.row>div:nth-child(4){display:none}}
</style>
</head>
<body>
<header><div class="wrap head"><div><h1>SupplyDesk Admin</h1><div class="muted">Supplier verification & profile update queue</div></div><button id="logout">Clear Token</button></div></header>
<main class="wrap">
<div class="toolbar"><input id="token" type="password" placeholder="Admin token"><button class="primary" onclick="saveToken()">Use Token</button><select id="status"><option value="">All applications</option><option value="under_review">Under Review</option><option value="query">Query</option><option value="approved">Approved</option><option value="rejected">Rejected</option></select><button onclick="loadApps()">Applications</button><button onclick="loadUpdates()">Supplier Updates</button><button onclick="loadProducts()">Products</button></div>
<div id="message" class="muted"></div>
<div class="grid">
<section class="card"><div id="list">Enter your admin token to load applications.</div></section>
<section class="card detail" id="detail"><h2>Select an application</h2><div class="muted">Documents and legal details remain private to this admin area.</div></section>
</div>
</main>
<script>
const key="supplydesk_admin_token";
const tokenInput=document.getElementById("token");
tokenInput.value=sessionStorage.getItem(key)||"";
function token(){return sessionStorage.getItem(key)||tokenInput.value.trim()}
function saveToken(){const t=tokenInput.value.trim();if(!t)return;sessionStorage.setItem(key,t);loadApps()}
document.getElementById("logout").onclick=()=>{sessionStorage.removeItem(key);tokenInput.value="";document.getElementById("list").textContent="Enter your admin token to load applications.";document.getElementById("detail").innerHTML="<h2>Select an application</h2>"};
async function api(url,options={}){const headers=Object.assign({"x-admin-token":token()},options.headers||{});const r=await fetch(url,Object.assign({},options,{headers}));const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||"Request failed");return data}
async function loadApps(){try{const q=document.getElementById("status").value;const data=await api("/api/admin/applications"+(q?"?status="+encodeURIComponent(q):""));document.getElementById("message").textContent="";renderList(data.applications)}catch(e){document.getElementById("message").textContent=e.message}}
function renderList(items){if(!items.length){document.getElementById("list").innerHTML="<div class='muted'>No applications found.</div>";return}document.getElementById("list").innerHTML='<div class="row header"><div>Business</div><div>Location</div><div>Category</div><div>Status</div><div></div></div>'+items.map(a=>`<div class="row"><div><strong>${esc(a.legal_name)}</strong><br><span class="muted">${esc(a.business_email)}</span></div><div>${esc(a.city)}, ${esc(a.country)}</div><div>${esc(a.category)}<br>${esc(a.subcategory)}</div><div><span class="badge">${esc(a.status)}</span></div><div><button onclick="openApp('${a.id}')">Review</button></div></div>`).join("")}
async function loadUpdates(){
  try{
    const data=await api("/api/admin/supplier-updates");
    document.getElementById("message").textContent="";
    renderUpdates(data.updates);
  }catch(e){document.getElementById("message").textContent=e.message}
}
function renderUpdates(items){
  if(!items.length){document.getElementById("list").innerHTML="<div class='muted'>No supplier updates found.</div>";return}
  document.getElementById("list").innerHTML='<div class="row header"><div>Business</div><div>Location</div><div>Submitted</div><div>Status</div><div></div></div>'+items.map(u=>`<div class="row"><div><strong>${esc(u.trade_name||u.legal_name)}</strong><br><span class="muted">${esc(u.business_email)}</span></div><div>${esc(u.city)}, ${esc(u.country)}</div><div>${esc(new Date(u.created_at).toLocaleString())}</div><div><span class="badge">${esc(u.status)}</span></div><div><button onclick="openUpdate('${u.id}')">Review</button></div></div>`).join("");
}
async function loadProducts(){
  try{
    const data=await api("/api/admin/products?status=pending");
    document.getElementById("message").textContent="";
    renderProducts(data.products);
  }catch(e){document.getElementById("message").textContent=e.message}
}
function renderProducts(items){
  if(!items.length){document.getElementById("list").innerHTML="<div class='muted'>No pending product listings.</div>";return}
  document.getElementById("list").innerHTML='<div class="row header"><div>Product</div><div>Supplier</div><div>Category</div><div>Status</div><div></div></div>'+items.map(p=>`<div class="row"><div><strong>${esc(p.product_name)}</strong><br><span class="muted">${esc(p.market_scope)}</span></div><div>${esc(p.trade_name||p.legal_name)}<br><span class="muted">${esc(p.city)}, ${esc(p.country)}</span></div><div>${esc(p.category)}<br>${esc(p.subcategory)}</div><div><span class="badge">${esc(p.status)}</span></div><div><button onclick="openProductReview('${p.id}')">Review</button></div></div>`).join("");
}
async function openProductReview(id){
  try{
    const data=await api("/api/admin/products?status=pending");
    const p=(data.products||[]).find(x=>x.id===id);
    if(!p)throw new Error("Product not found.");
    document.getElementById("detail").innerHTML=`<h2>${esc(p.product_name)}</h2><div class="status"><strong>Status:</strong> ${esc(p.status)}</div><div class="kv"><b>Supplier</b><span>${esc(p.trade_name||p.legal_name)}</span><b>Location</b><span>${esc(p.city)}, ${esc(p.country)}</span><b>Category</b><span>${esc(p.category)} → ${esc(p.subcategory)}</span><b>Market</b><span>${esc(p.market_scope)}</span><b>MOQ</b><span>${esc(p.moq||"Not provided")}</span><b>Unit</b><span>${esc(p.unit||"Not provided")}</span><b>Description</b><span>${esc(p.description||"Not provided")}</span></div><h3>Admin decision</h3><textarea id="productNotes" placeholder="Verification notes">${esc(p.admin_notes||"")}</textarea><div class="actions"><button class="approve" onclick="setProductStatus('${p.id}','approved')">Approve & Publish</button><button class="danger" onclick="setProductStatus('${p.id}','rejected')">Reject</button></div>`;
  }catch(e){document.getElementById("message").textContent=e.message}
}
async function setProductStatus(id,status){
  try{
    const notes=document.getElementById("productNotes")?.value||"";
    await api("/api/admin/products/"+id,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({status,adminNotes:notes})});
    document.getElementById("message").textContent=status==="approved"?"Product approved and published.":"Product rejected.";
    await loadProducts();
  }catch(e){document.getElementById("message").textContent=e.message}
}
async function openUpdate(id){
  try{
    const d=await api("/api/admin/supplier-updates/"+id),u=d.update,p=d.payload||{};
    const labels={legal_name:"Legal name",trade_name:"Trade / brand",business_type:"Business type",country:"Country",city:"City",address:"Address",business_email:"Business email",business_phone:"Business phone",contact_person:"Contact person",designation:"Designation",website:"Website",category:"Category",subcategory:"Sub-category"};
    const changes=Object.keys(p).length?Object.entries(p).map(([k,v])=>`<b>${esc(labels[k]||k)}</b><span>${esc(v)}</span>`).join(""):"<span class='muted'>Documents only</span>";
    document.getElementById("detail").innerHTML=`<h2>${esc(u.trade_name||u.legal_name)}</h2><div class="status"><strong>Update status:</strong> ${esc(u.status)}</div><h3>Requested changes</h3><div class="kv">${changes}</div><h3>New documents</h3><div class="files">${d.files.length?d.files.map(f=>`<div>${esc(f.file_type)} · ${esc(f.original_name)} · ${Math.round(f.file_size/1024)} KB <button onclick="viewUpdateFile('${f.id}')">View</button></div>`).join(""):"<span class='muted'>No new documents.</span>"}</div><h3>Admin decision</h3><textarea id="notes" placeholder="Verification notes">${esc(u.admin_notes||"")}</textarea><div class="actions"><button class="approve" onclick="setUpdateStatus('${u.id}','approved')">Approve & Publish</button><button onclick="setUpdateStatus('${u.id}','query')">Query</button><button class="danger" onclick="setUpdateStatus('${u.id}','rejected')">Reject</button></div>`;
  }catch(e){document.getElementById("message").textContent=e.message}
}
async function setUpdateStatus(id,status){
  try{
    const notes=document.getElementById("notes")?.value||"";
    await api("/api/admin/supplier-updates/"+id,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({status,adminNotes:notes})});
    document.getElementById("message").textContent=status==="approved"?"Supplier update approved and published.":"Supplier update reviewed.";
    await loadUpdates(); await openUpdate(id);
  }catch(e){document.getElementById("message").textContent=e.message}
}
async function viewUpdateFile(id){
  try{
    const r=await fetch("/api/admin/supplier-update-files/"+encodeURIComponent(id),{headers:{"x-admin-token":token()}});
    if(!r.ok)throw new Error("Could not open file.");
    const blob=await r.blob(),url=URL.createObjectURL(blob);window.open(url,"_blank","noopener");setTimeout(()=>URL.revokeObjectURL(url),60000);
  }catch(e){document.getElementById("message").textContent=e.message}
}
async function openApp(id){try{const d=await api("/api/admin/applications/"+id);const a=d.application;document.getElementById("detail").innerHTML=`<h2>${esc(a.legal_name)}</h2><div class="status"><strong>Status:</strong> ${esc(a.status)}</div><div class="kv"><b>Business type</b><span>${esc(a.business_type)}</span><b>Location</b><span>${esc(a.city)}, ${esc(a.country)}</span><b>Address</b><span>${esc(a.address)}</span><b>Contact</b><span>${esc(a.contact_person)} · ${esc(a.designation||"")}</span><b>Email</b><span>${esc(a.business_email)}</span><b>Phone</b><span>${esc(a.business_phone)}</span><b>Registration</b><span>${esc(a.registration_number||"Not provided")}</span><b>Tax/VAT/GST</b><span>${esc(a.tax_number||"Not provided")}</span><b>Import/Export</b><span>${esc(a.import_export_number||"Not provided")}</span><b>Category</b><span>${esc(a.category)} → ${esc(a.subcategory)}</span><b>Website</b><span>${a.website?`<a href="${esc(a.website)}" target="_blank" rel="noopener">${esc(a.website)}</a>`:"Not provided"}</span></div><h3>Uploaded files</h3><div class="files">${d.files.length?d.files.map(f=>`<div>${esc(f.file_type)} · ${esc(f.original_name)} · ${Math.round(f.file_size/1024)} KB <button onclick="viewFile('${f.id}')">View</button></div>`).join(""):"<span class='muted'>No files uploaded.</span>"}</div><h3>Admin decision</h3><textarea id="notes" placeholder="Verification notes">${esc(a.admin_notes||"")}</textarea><div class="actions"><button class="approve" onclick="setStatus('${a.id}','approved')">Approve & Publish</button><button onclick="setStatus('${a.id}','query')">Query</button><button class="danger" onclick="setStatus('${a.id}','rejected')">Reject</button></div>` }catch(e){document.getElementById("message").textContent=e.message}}
async function setStatus(id,status){try{const notes=document.getElementById("notes")?.value||"";await api("/api/admin/applications/"+id,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({status,adminNotes:notes})});document.getElementById("message").textContent="Application updated.";await loadApps();await openApp(id)}catch(e){document.getElementById("message").textContent=e.message}}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function viewFile(id){
  try{
    const r=await fetch("/api/admin/files/"+encodeURIComponent(id),{headers:{"x-admin-token":token()}});
    if(!r.ok) throw new Error("Could not open file.");
    const blob=await r.blob();
    const url=URL.createObjectURL(blob);
    window.open(url,"_blank","noopener");
    setTimeout(()=>URL.revokeObjectURL(url),60000);
  }catch(e){document.getElementById("message").textContent=e.message}
}
document.getElementById("status").onchange=loadApps;
if(sessionStorage.getItem(key)){loadApps()}
</script>
</body>
</html>
