name: Auto PR

# Opens a pull request to main whenever a fix/*, feat/* or ci/* branch is pushed.
# Needs: Settings -> Actions -> General -> "Allow GitHub Actions to create and approve pull requests".
on:
  push:
    branches:
      - "fix/**"
      - "feat/**"
      - "ci/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Create PR if none exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          existing=$(gh pr list --repo "$REPO" --head "$BRANCH" --base main --state open --json number --jq 'length')
          if [ "$existing" != "0" ]; then
            echo "PR already open for $BRANCH"
            exit 0
          fi
          gh api "repos/$REPO/commits/${{ github.sha }}" --jq '.commit.message' > /tmp/msg.txt
          title=$(head -n1 /tmp/msg.txt)
          body=$(tail -n +3 /tmp/msg.txt)
          gh pr create --repo "$REPO" --base main --head "$BRANCH" --title "$title" --body "${body:-Automated PR for $BRANCH}"
