name: SupplyDesk Full Buyer E2E

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  full-flow:
    name: Isolated buyer OTP and enquiry flow
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Initialize isolated test database
        env:
          MYSQL_PWD: root
        run: |
          sed '/^ALTER TABLE connect_requests/,$d' database/schema.sql > /tmp/schema.sql
          mysql -h 127.0.0.1 -uroot -e "CREATE DATABASE IF NOT EXISTS supplydesk CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          mysql -h 127.0.0.1 -uroot supplydesk < /tmp/schema.sql
      - name: Start SupplyDesk test server
        env:
          PORT: 3000
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: supplydesk
          E2E_TEST_MODE: "true"
          E2E_TEST_KEY: ci-test-key
          SUPPLYDESK_BUILD: ci-e2e
        run: |
          nohup node server.js > /tmp/supplydesk.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/api/version >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/api/version
      - name: Seed isolated supplier and product
        env:
          MYSQL_PWD: root
        run: mysql -h 127.0.0.1 -uroot supplydesk < tests/e2e/seed.sql
      - name: Run full buyer E2E
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:3000
          E2E_TEST_KEY: ci-test-key
        run: npx playwright test tests/e2e/full-buyer-flow.spec.js
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: supplydesk-full-buyer-e2e-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: supplydesk-e2e-server-log
          path: /tmp/supplydesk.log
          retention-days: 14
